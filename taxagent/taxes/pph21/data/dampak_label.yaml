dasar:
  PMK 114 Tahun 2025: {key: [mekanisme_pemotongan], diverifikasi: true, catatan: "Pasal 12 ayat (3): zakat/sumbangan keagamaan wajib lewat pemberi kerja dapat dikurangkan dari bruto dalam hitungan PPh Pasal 21"}
  PMK 168 Tahun 2023: {key: [biaya_jabatan, biaya_pensiun, ter_harian, bukan_pegawai, mekanisme_pemotongan], diverifikasi: true, catatan: "Pasal 10 ayat (2) biaya jabatan 5%/500rb/6jt; Pasal 11 ayat (2) biaya pensiun 5%/200rb/2,4jt; DPP harian 50% di atas Rp2,5jt; DPP bukan pegawai 50%; Pasal 8-16 mekanisme. Tidak dilabel (menulis ulang UU PPh): pph26 (Pasal 14, 20% = UU Pasal 26), pembulatan_pkp (= UU Pasal 17 ayat (4))"}
  PP 58 Tahun 2023: {key: [ter_bulanan, ter_harian, kategori_ter], diverifikasi: true, catatan: "Pasal 2 ayat (2)-(6) + Lampiran A-D. Pasal 4 mencabut Pasal 2 ayat (3) PP 80/2010 (cara hitung PNS dengan tarif Pasal 17), konsekuensi TER, bukan key terpisah"}
  PMK 66 Tahun 2023: {key: [natura], diverifikasi: true, catatan: "perlakuan PPh natura/kenikmatan sebagai penghasilan pegawai (pelaksanaan UU HPP + PP 55/2022)"}
  PP 55 Tahun 2022: {key: [natura], diverifikasi: true, catatan: "BAB VI Pasal 23-27 natura/kenikmatan. BAB IX zakat = sisi penerima zakat (bukan objek), bukan pengurang PPh 21; tarif Pasal 17 hanya dirujuk"}
  UU 7 Tahun 2021: {key: [tarif_pasal_17, natura, ptkp], diverifikasi: true, catatan: "Pasal 3 HPP mengubah UU PPh: Pasal 4 (natura objek), Pasal 7 ayat (1) dan (3) (PTKP paling sedikit Rp54jt, mekanisme penyesuaian), Pasal 17 ayat (1) (lapisan tarif). ptkp terlewat di draf awal, ditambahkan 2026-10-07"}
  PMK 167 Tahun 2018: {key: [natura], diverifikasi: true, catatan: "Pasal 2 ayat (3): makanan/minuman seluruh pegawai dan natura daerah tertentu bukan penghasilan pegawai"}
  PMK 40 Tahun 2017: {key: [mekanisme_pemotongan], diverifikasi: true, catatan: "pelaksanaan PP 41/2016: PPh 21 final 2,5%/15% pemberi kerja kriteria tertentu, daftar pegawai; berlaku 2016-2017"}
  PP 41 Tahun 2016: {key: [mekanisme_pemotongan], diverifikasi: true, catatan: "Pasal 1 ayat (3)-(7): tarif final 2,5% (PKP <= 50jt) / 15%, Masa Juli 2016 s.d. Desember 2017; Pasal 17 hanya dirujuk untuk tahun berikutnya"}
  PER-16/PJ/2016: {key: [mekanisme_pemotongan, bukan_pegawai], diverifikasi: true, catatan: "pedoman teknis pra-TER; DPP bukan pegawai 50% dikurangi PTKP per bulan (README TEMUAN #7). Tidak dilabel (menulis ulang): PTKP (PMK 101), biaya jabatan, PPh 26 20% (Pasal 19), non-NPWP 120% (Pasal 20, = UU Pasal 21 ayat (5a)), pembulatan, batas harian Rp450rb (PMK 102)"}
  PMK 102 Tahun 2016: {key: [ter_harian], diverifikasi: true, catatan: "Pasal 1-2: batas Rp450.000 sehari / Rp4.500.000 sebulan tidak dipotong"}
  PMK 101 Tahun 2016: {key: [ptkp], diverifikasi: true, catatan: "Pasal 1: PTKP 54jt / 4,5jt / 54jt / 4,5jt"}
  PMK 68 Tahun 2020: {key: [mekanisme_pemotongan], diverifikasi: true, catatan: "ditambahkan lewat adjudikasi FP LLM 2026-10-07: Pasal 2 ayat (2)-(3) beasiswa memenuhi syarat bukan objek PPh (komponen yang dikeluarkan dari bruto pegawai); tidak ada key objek tersendiri di graf, jadi mekanisme_pemotongan"}
  PER-23/PJ/2025: {key: [mekanisme_pemotongan], diverifikasi: true, catatan: "ditambahkan 2026-11-16 (adjudikasi 2026-11-15, diputuskan penulis): Pasal 3-4 subjek pajak dalam/luar negeri orang pribadi (183 hari, KITAP/VITAS/ITAS) menentukan dipotong PPh 21 atau PPh 26; tarif PPh 26 tidak ditetapkan di sini, jadi bukan pph26"}
  UU 11 Tahun 2020: {key: [mekanisme_pemotongan], diverifikasi: true, catatan: "ditambahkan 2026-11-16 (adjudikasi 2026-11-15, diputuskan penulis): mengubah Pasal 2 UU PPh, subjek pajak orang pribadi (WNA/WNI, 183 hari) yang menentukan PPh 21 atau PPh 26. Tidak dilabel (menulis ulang): natura Pasal 4 ayat (1) huruf d"}
  PP 73 Tahun 2016: {key: [mekanisme_pemotongan], diverifikasi: true, catatan: "ditambahkan 2026-11-16 (adjudikasi 2026-11-15, diputuskan penulis): Pasal 8 ayat (3) iuran JHT dan JP yang dibayar peserta dapat dibiayakan (pengurang bruto PPh 21); tidak ada key iuran tersendiri di graf, jadi mekanisme_pemotongan (preseden PMK 68/2020)"}
