    kategori: pegawai_tetap_bulanan
    perilaku: hitung
    pertanyaan: >-
      Karyawan tetap, gaji 15 juta sebulan, tunjangan transport 1 juta, menikah
      anak 1, punya NPWP. Berapa PPh 21 bulan Maret 2025?
    tool: calculate_pph21_permanent_monthly
    argumen: {gaji_pokok: 15000000, tunjangan_tidak_tetap: 1000000, status_ptkp: K/1, masa_pajak: 3, tahun_pajak: 2025}
    argumen_dinilai: [gaji_pokok, status_ptkp, masa_pajak, tahun_pajak]

  - id: pt-ter-02
