    tidak bertentangan dengan Peraturan Pemerintah Pengganti Undang-Undang ini; dan b. semua peraturan perundang-undangan
    yang merupakan peraturan pelaksanaan dari Undang- Undang Nomor 11 Tahun 2020 tentang Cipta Kerja masih tetap berlaku sepanjang
    tidak bertentangan dengan Peraturan Pemerintah Pengganti Undang- Undang ini. Pasal 185 Dengan berlakunya Peraturan Pemerintah
