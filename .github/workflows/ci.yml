name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e ".[dev,monitor,rater,graph,agent]"
      - name: Ruff
        run: ruff check taxagent tests pipeline experiments
      - name: Pytest
        run: pytest -q
